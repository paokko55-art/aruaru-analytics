<h1>あるある研究所 分析ツール</h1>
<p>このツールは、YouTube チャンネル「ガルちゃんあるある研究所」の運営者が、<strong>自分のチャンネルの数字（再生数・視聴時間など）を読むためだけ</strong>に使う、個人用のプログラムです。</p>
<ul>
  <li>使う権限は読み取り専用の2つだけです（YouTube Data API の youtube.readonly、YouTube Analytics API の yt-analytics.readonly）。</li>
  <li>動画の投稿・変更・削除や、チャンネルの設定の変更はしません（権限がないのでできません）。</li>
  <li>運営者本人以外が使うことは想定していません。</li>
</ul>
